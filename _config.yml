# Site settings
title: "Babatope Ajepe — Odoo Database Migration Specialist"
description: "Odoo database migration: version upgrades, custom module porting, data migration and PostgreSQL tuning. Rehearsed, zero-downtime cutovers for Odoo systems from 13 to 18 — Community and Enterprise."
url: "https://babatopeajepe.com"
baseurl: ""
lang: en

# Author info
author: "Babatope Ajepe"
email: "contact@babatopeajepe.com"
linkedin: "https://linkedin.com/in/babatopeajepe"
github: "https://github.com/babatopeajepe"
upwork: "https://upwork.com/freelancers/~01b4a3b4a4b4a4b4"

# Build settings
markdown: kramdown
highlighter: rouge

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Babatope Ajepe"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      author: "Babatope Ajepe"

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - Dockerfile
  - docker-compose.yml
  - QUICK_START.md

# SEO
twitter:
  username: babatopeajepe
  card: summary_large_image

social:
  name: Babatope Ajepe
  links:
    - https://linkedin.com/in/babatopeajepe
    - https://github.com/babatopeajepe
    - https://upwork.com/freelancers/~01b4a3b4a4b4a4b4

# Google Analytics (add your tracking ID)
google_analytics: # UA-XXXXXXXX-X
