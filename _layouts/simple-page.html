---
layout: default
---

<article class="page">
  <div class="term-bar">
    <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
    <span class="term-title">~{{ page.url }} — zsh</span>
  </div>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}
  <p class="subtitle">{{ page.subtitle }}</p>
  {% endif %}
  {{ content }}
</article>
