---
layout: default
---

<article class="page">
  <header class="page-hero">
    <div class="container">
      <p class="eyebrow">Field note</p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
      {% if page.tech_stack %}
      <div class="tech-stack">
        {% for tech in page.tech_stack %}
        <span class="tech-tag">{{ tech }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <div class="container page-layout page-layout--narrow">
    <div class="page-content prose">
      {{ content }}
    </div>
  </div>

  <footer class="post-footer">
    <a class="text-link" href="{{ "/projects/" | relative_url }}">← All projects</a>
    <a class="text-link" href="{{ "/contact/" | relative_url }}">Discuss a migration <span class="arrow" aria-hidden="true">→</span></a>
  </footer>
</article>
