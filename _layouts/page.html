---
layout: default
---

<article class="page">
  <header class="page-hero">
    <div class="container">
      <p class="eyebrow">{{ page.eyebrow | default: "Babatope Ajepe" }}</p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </header>

  <div class="container page-layout page-layout--narrow">
    <div class="page-content prose">
      {{ content }}
    </div>
  </div>
</article>
