---
layout: default
---

<article class="page">
  <header class="page-header container-narrow">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="subtitle">{{ page.subtitle }}</p>
    {% endif %}
    {% if page.tech_stack %}
    <div class="tech-stack">
      {% for tech in page.tech_stack %}
      <span class="tech-tag">{{ tech }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="page-content prose container-narrow">
    {{ content }}
  </div>

  <footer class="post-footer container-narrow">
    <a class="link-arrow" href="{{ "/projects/" | relative_url }}">← All projects</a>
  </footer>
</article>
